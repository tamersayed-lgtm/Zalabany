<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2730">
<title>لوحة تحكم د. أحمد الزلباني</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#12292f;--mut:#6b838b;--line:#e4ebed;--blue:#0b6e72;--teal:#12a79d;--amb:#b36a00;--grn:#168256;--red:#d1433a;--side:#0a2730;--side2:#0e3b46;--sh:0 1px 2px rgba(18,41,47,.04),0 8px 24px -12px rgba(18,41,47,.12);--shh:0 2px 4px rgba(18,41,47,.05),0 16px 32px -14px rgba(18,41,47,.2);--r:16px;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#071a1f;--card:#0e2830;--ink:#e6f1f2;--mut:#8aa6ad;--line:#1a3943;--blue:#1a9693;--amb:#f0b13f;--grn:#25a672;--red:#e5594f;--side:#051217;--side2:#09262e;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);--shh:0 16px 36px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-t=dark]{--bg:#071a1f;--card:#0e2830;--ink:#e6f1f2;--mut:#8aa6ad;--line:#1a3943;--blue:#1a9693;--amb:#f0b13f;--grn:#25a672;--red:#e5594f;--side:#051217;--side2:#09262e;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);--shh:0 16px 36px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body.mo{overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--teal) 30%,transparent)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:20px 14px calc(16px + env(safe-area-inset-bottom));position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;overflow:auto;z-index:40;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
.logo{display:flex;gap:12px;align-items:center;padding:2px 8px 20px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1fc3b6,#0b6e72);display:grid;place-items:center;box-shadow:0 8px 20px -8px #14a39a;flex:none}
.logo i .ic{width:20px;height:20px;stroke-width:2.4;color:#fff}
.logo b{display:block;font-size:14px;font-weight:600}.logo small{opacity:.55;font-size:11px}
.nv{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:13.5px;color:rgba(255,255,255,.66);font-weight:500;text-align:start;position:relative;transition:background .2s,color .2s}
.nv .ic{opacity:.85}
.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nv.on{background:linear-gradient(90deg,rgba(94,234,212,.16),rgba(255,255,255,.05));color:#fff;font-weight:600}
.nv.on .ic{color:#5eead4;opacity:1}
.nv.on:before{content:"";position:absolute;inset-block:10px;inset-inline-start:-14px;width:4px;border-radius:0 4px 4px 0;background:#5eead4}
.bdg{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#f5b94a;color:#3a2600;font-size:11px;font-weight:700;display:grid;place-items:center}
.bdg[hidden]{display:none}
.sp{flex:1}.sm{font-size:11.5px;opacity:.5;padding:6px 14px}
.sc{display:none}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.ttl{flex:1;min-width:0}
h1{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.2px}
.top p{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tact{display:flex;gap:8px;align-items:center}
.ib.mb{display:none}
.wrap{padding:8px 28px 48px;max-width:1360px;width:100%}
.pg{display:none}.pg.on{display:block;animation:fi .35s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}

/* ---------- أزرار وحقول ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;padding:8px 15px;border-radius:12px;font-weight:600;font-size:13px;min-height:38px;text-decoration:none;transition:transform .15s var(--ease),filter .2s,box-shadow .2s,background .2s;box-shadow:0 1px 2px rgba(11,110,114,.2)}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 16px -8px var(--blue)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.g:hover{background:var(--bg);filter:none;box-shadow:none;border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
#pb{background:var(--grn);animation:pl 1.8s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #1f8a5726}}
.in{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,box-shadow .2s}
.in:focus,.sr input:focus,.tb select:focus,.lo input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 20%,transparent)}

/* ---------- نظرة عامة ---------- */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;border-radius:20px;margin-bottom:16px;color:#fff;background:radial-gradient(90% 140% at 100% 0%,rgba(94,234,212,.28),transparent 60%),linear-gradient(120deg,#0a3a45,#0b6e72 75%,#12a79d);box-shadow:0 18px 40px -22px #0b6e72}
.hero .hi{position:relative;z-index:1}.hero small{opacity:.75;font-size:12.5px}.hero h2{font-size:21px;font-weight:700;margin:2px 0 4px}.hero p{opacity:.92;font-size:13.5px}
.hero .btn{position:relative;z-index:1;background:#fff;color:#0a3a45;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.ecg{position:absolute;left:0;bottom:8px;width:52%;height:72%;fill:none;stroke:rgba(255,255,255,.18);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ecg path{vector-effect:non-scaling-stroke}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .25s var(--ease),box-shadow .25s}
.k:hover{transform:translateY(-3px);box-shadow:var(--shh)}
.ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;background:#0000000d;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.k small{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
.k b{display:block;font-size:28px;font-weight:700;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.gr{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.gr2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.c h3{font-size:14.5px;font-weight:600;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--mut);gap:5px}
.bars i{width:100%;max-width:28px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--teal),var(--blue));min-height:3px;transition:height .8s var(--ease),filter .2s}
.bars div:hover i{filter:brightness(1.15)}
.hb{margin-bottom:14px;font-size:13px}.hb div{display:flex;justify-content:space-between;margin-bottom:6px}
.hb u{display:block;height:8px;border-radius:9px;background:var(--line)}.hb u i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .8s var(--ease)}
.dn{width:130px;height:130px;border-radius:50%;margin:4px auto 16px;display:grid;place-items:center}
.dn span{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.lg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}

/* ---------- الجداول والبطاقات ---------- */
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tb select{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:12px;min-width:140px;min-height:40px;font-size:13px;transition:border-color .2s,box-shadow .2s}
.sr{position:relative;flex:1;min-width:200px;display:block}
.sr .ic{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;color:var(--mut);pointer-events:none}
.sr input{width:100%;min-height:40px;background:var(--card);border:1px solid var(--line);padding:8px 13px;padding-inline-start:40px;border-radius:12px;font-size:13px;transition:border-color .2s,box-shadow .2s}
.p{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pending{background:#f2a51622;color:var(--amb)}.confirmed{background:#1f8a5722;color:var(--grn)}.cancelled{background:#d6453b22;color:var(--red)}.done{background:#8b5cf622;color:#8b5cf6}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.cb:hover{transform:translateY(-2px);box-shadow:var(--shh);border-color:color-mix(in srgb,var(--teal) 35%,var(--line))}
.cb h4{margin-bottom:6px;font-weight:600;font-size:14.5px}.cb small{color:var(--mut);display:block;line-height:1.9}
.dy{display:inline-block;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;padding:2px 12px;border-radius:20px;font-size:11.5px;font-weight:600;margin:6px 0}
/* ---------- بطاقات الحجوزات ---------- */
.bkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
.bkc{--sc:var(--mut);position:relative;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid color-mix(in srgb,var(--sc) 32%,var(--line));border-radius:18px;padding:18px 16px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.bkc:before{content:"";position:absolute;inset-inline:22px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--sc)}
.bkc[data-s=pending]{--sc:var(--amb);background:linear-gradient(color-mix(in srgb,var(--amb) 7%,var(--card)),var(--card))}
.bkc[data-s=confirmed]{--sc:var(--grn)}.bkc[data-s=cancelled]{--sc:var(--red)}.bkc[data-s=done]{--sc:#8b5cf6}
.bkc:hover{transform:translateY(-2px);box-shadow:var(--shh);border-color:color-mix(in srgb,var(--sc) 40%,var(--line))}
.bkc:active{transform:scale(.99)}
.bkh{display:flex;align-items:center;gap:12px;min-width:0}
.bkh .pav{width:44px;height:44px;border-radius:14px;font-size:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 70%,#fff),var(--sc));box-shadow:0 8px 16px -8px var(--sc)}
.bki{flex:1;min-width:0}
.bkn{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.bkn b{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.bkn .p{padding:2px 9px;font-size:11px}
.bki small{display:block;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:1px}
.bkm{display:flex;flex-direction:column;gap:7px;padding-top:11px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink)}
.bkm span{display:flex;align-items:center;gap:8px;min-width:0}
.bkm .ic{width:15px;height:15px;color:var(--mut)}
.bkm em{font-style:normal;overflow-wrap:anywhere}
.btn.xs{flex:none;width:34px;height:34px;min-height:0;padding:0;border-radius:11px}
.btn.xs .ic{width:18px;height:18px;stroke-width:2.2}
.nth{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.nth h3{margin:0}
.lkb{flex:none;font-size:11.5px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.bcd{flex:none;align-self:center;font-size:12.5px;font-weight:800;letter-spacing:1.2px;color:var(--teal);background:color-mix(in srgb,var(--teal) 13%,transparent);border-radius:10px;padding:4px 9px}
.cdb{cursor:pointer;letter-spacing:1.5px;color:var(--teal)}
.acc{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.acc>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px;font-size:15px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary small{color:var(--mut);font-weight:500;margin-inline-start:4px}
.acc>summary:after{content:"▾";color:var(--mut);transition:transform .2s}.acc[open]>summary:after{transform:rotate(180deg)}
.acc>.c{margin:0!important;border:0;box-shadow:none;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.acc>.c>h3,.acc>.c>div:first-child>h3{display:none}
.ta{resize:vertical;min-height:72px;line-height:1.8;font-family:inherit;display:block}
.pdt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.pdt>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pdt>summary::-webkit-details-marker{display:none}
.pdt>summary:after{content:"▾";color:var(--mut);transition:transform .2s}.pdt[open]>summary:after{transform:rotate(180deg)}
.psec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.bkn .tg{margin:0;padding:2px 9px;font-size:11px}
.bkh .la{align-self:center}
.bda{margin-top:12px;max-width:620px}

/* ---------- لوحة التفاصيل ---------- */
.dr{position:fixed;inset:0;background:rgba(4,16,20,.5);display:none;z-index:50;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}.dr.o{display:block;animation:fo .25s}
@keyframes fo{from{opacity:0}}
.dp{position:absolute;inset:0 auto 0 0;width:min(460px,100%);background:var(--card);padding:24px;overflow:auto;animation:sl .35s var(--ease);box-shadow:20px 0 60px rgba(0,0,0,.25)}
@keyframes sl{from{transform:translateX(-100%)}}
.dp h2{margin-bottom:4px;font-size:18px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.ln:last-child{border-bottom:0}
.ln>div:first-child{flex:1;min-width:0;line-height:1.8}.ln b{overflow-wrap:anywhere;font-weight:600}.ln span{color:var(--mut)}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.ac .btn{text-align:center}

/* ---------- الدخول والإشعارات ---------- */
.lo{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(120% 90% at 85% 0%,#0e6a73,transparent 60%),radial-gradient(80% 70% at 0% 100%,#0c4a52,transparent 60%),linear-gradient(160deg,#061a20,#0a3a45)}
.lo form{background:var(--card);padding:32px 28px;border-radius:26px;width:min(410px,100%);display:grid;gap:13px;box-shadow:0 40px 90px rgba(0,0,0,.45);animation:fi .5s var(--ease)}
.lm{width:52px;height:52px;margin:0 auto;border-radius:16px;background:linear-gradient(135deg,#1fc3b6,#0b6e72);display:grid;place-items:center;color:#fff;box-shadow:0 12px 24px -10px #12a79d}
.lm .ic{width:26px;height:26px;stroke-width:2.4}
.lo input{padding:11px 15px;min-height:44px;border-radius:13px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s,box-shadow .2s}
.lo h2{text-align:center;font-size:20px}.lo p{text-align:center;color:var(--mut);font-size:13px}.lo p b{color:var(--ink);font-weight:600}
.lo .btn{min-height:44px;font-size:14px}
.er{color:var(--red);font-size:13px;text-align:center;min-height:18px}
.ts{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:14px;z-index:70;display:none;font-weight:500;max-width:90vw;text-align:center;box-shadow:0 16px 36px -10px rgba(0,0,0,.5);animation:tu .3s var(--ease)}
@keyframes tu{from{opacity:0;transform:translate(-50%,12px)}}
.bnav{display:none}

/* ---------- الهاتف واللوحي ---------- */
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,86vw);transform:translateX(100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
 .mo aside{transform:none;visibility:visible;transition-delay:0s;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
 .sc{display:block;position:fixed;inset:0;z-index:35;background:rgba(4,16,20,.5);opacity:0;pointer-events:none;transition:opacity .25s}
 .mo .sc{opacity:1;pointer-events:auto}
 .top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
 .ib.mb{display:grid}
 h1{font-size:17px}.top p{font-size:11px}
 .tact .btn.g{width:40px;padding:0}.tact .tx{display:none}
 #pb{position:fixed;inset-inline-end:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;box-shadow:0 12px 26px -8px rgba(24,130,87,.65)}
 .wrap{padding:6px 12px calc(130px + env(safe-area-inset-bottom))}
 .gr,.gr2{grid-template-columns:minmax(0,1fr)}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:10.5px;font-weight:500;color:var(--mut);position:relative}
 .bn .pi{width:50px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .25s}
 .bn .ic{width:20px;height:20px}
 .bn.on{color:var(--blue);font-weight:600}.bn.on .pi{background:#0b6e721f;background:color-mix(in srgb,var(--blue) 16%,transparent)}
 .bn .bdg{position:absolute;top:-2px;inset-inline-start:calc(50% + 6px);margin:0;min-width:18px;height:18px;padding:0 5px;font-size:11px}
 .ts{bottom:calc(124px + env(safe-area-inset-bottom))}
}
@media(max-width:720px){
 .kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.k:last-child{grid-column:1/-1}
 .k{padding:11px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:11px;align-items:center}
 .k:hover{transform:none}
 .ki{grid-row:1/3;margin:0}.k small{font-size:11.5px}.k b{font-size:21px;margin-top:0}
 .k:last-child{grid-template-columns:auto 1fr}

const DOC0={"phone":"01091532139","whatsapp":"201091532139","about":["استشاري جراحة المناظير وجراحات السمنة المفرطة","25 عامًا من الخبرة في مجال الخدمات الطبية","يُعد الدكتور أحمد الزلباني من الأطباء المتخصصين في جراحة المناظير وجراحات السمنة المفرطة، ويتمتع بخبرة علمية وعملية في إجراء عمليات تكميم المعدة، وتحويل المسار، وعملية الساسي، إلى جانب جراحات الأطفال بالمنظار وعلاج فرط التعرق جراحيًا.","يرتكز نهج الدكتور أحمد الزلباني على دراسة الحالة الصحية لكل مريض بعناية، واختيار الإجراء العلاجي الأنسب وفقًا لاحتياجاته وتاريخه المرضي، مع الاهتمام بمعايير السلامة والدقة الجراحية والمتابعة الطبية بعد العملية.","نؤمن بأن علاج السمنة لا يقتصر على فقدان الوزن فحسب، بل يمثل خطوة نحو تحسين الصحة وجودة الحياة. لذلك، نحرص على تقديم رعاية طبية متكاملة تبدأ بالتقييم الدقيق، مرورًا بالتدخل العلاجي المناسب، وانتهاءً بالمتابعة المستمرة ودعم المريض خلال رحلة التعافي."],"vision":["أن نكون وجهة موثوقة للرعاية الجراحية المتخصصة، وأن نجعل رحلة العلاج تجربة إنسانية قائمة على الأمان والثقة والاهتمام بكل مريض."],"mission":["تقديم خدمات طبية متخصصة في جراحات المناظير والسمنة، وفقًا للأسس العلمية الحديثة، مع وضع احتياجات المريض في مقدمة أولوياتنا، ومساعدته على تحقيق أفضل النتائج الممكنة والحفاظ عليها من خلال المتابعة الطبية والتوجيه الغذائي."],"values":["الأمان أولًا: الالتزام بمعايير السلامة والتقييم الطبي الدقيق قبل أي إجراء.","الدقة والاحترافية: الاهتمام بالتفاصيل في جميع مراحل الرعاية.","الرعاية الإنسانية: التعامل مع كل مريض باحترام وتفهّم واهتمام.","الدعم المستمر: متابعة الحالة بعد العملية وتقديم الإرشادات اللازمة.","الشفافية: توضيح الخيارات العلاجية والفوائد والمخاطر والنتائج المتوقعة."],"servicesIntro":["يقدم الدكتور أحمد الزلباني خدماته في جراحات المناظير والسمنة، من خلال مستشفيات ومراكز طبية مجهزة، وبالتعاون مع فرق طبية متخصصة، وفقًا لنوع الإجراء واحتياجات كل حالة.","هدفنا هو توفير تجربة علاجية متكاملة تبدأ بالاستشارة والتشخيص، وتستمر خلال العلاج والتعافي، مع الحرص على التواصل الواضح مع المريض في كل خطوة."],"why":["اختيار الجراح المناسب خطوة مهمة في رحلة العلاج، ولذلك نحرص على أن يحصل كل مريض على المعلومات اللازمة لفهم حالته وخياراته العلاجية.","- خبرة طبية متخصصة: في جراحات المناظير والسمنة، وفقًا للتخصصات والإجراءات التي يقدمها الطبيب.","- تقييم فردي لكل حالة: لاختيار الإجراء الذي يتناسب مع الحالة الصحية والأهداف العلاجية.","- الاهتمام بمعايير السلامة: من خلال التحضير المناسب والتعاون مع الفريق الطبي.","- تقنيات جراحية حديثة: وفقًا لما يتناسب مع نوع العملية والتجهيزات المتاحة.","- متابعة ما بعد العملية: للاهتمام بالتغذية والتعافي ومراقبة النتائج.","- تواصل واضح مع المريض: لشرح الفوائد والمخاطر والبدائل والتوقعات الواقعية."],"journey":["سواء كنت تبحث عن حل علاجي للسمنة، أو ترغب في معرفة مدى ملاءمة إحدى جراحات المناظير لحالتك، فإن الخطوة الأولى هي الحصول على تقييم طبي متخصص.","احجز استشارتك مع الدكتور أحمد الزلباني للتعرف على الخيارات المتاحة، ومناقشة حالتك الصحية، ووضع خطة علاجية تناسب احتياجاتك."],"tagline":["الدكتور أحمد الزلباني — رعاية طبية متخصصة، واهتمام يبدأ من أول استشارة."],"disclaimer":["جميع الإجراءات الطبية والجراحية تخضع للتقييم الفردي، وتختلف النتائج والمخاطر من مريض إلى آخر. ولا يغني المحتوى التعريفي عن الاستشارة الطبية المتخصصة."]},PRO0={"procedures":[{"id":"sleeve","title":"تكميم المعدة","sub":"جراحات السمنة","icon":"♡","color":"pink","service":"جراحات السمنة","intro":["تكميم المعدة: خطوة نحو وزن صحي وحياة أفضل","تُعد عملية تكميم المعدة من جراحات السمنة الشائعة، وتساعد على تقليل كمية الطعام التي يمكن تناولها، بما يدعم فقدان الوزن وتحسين بعض المشكلات الصحية المرتبطة بالسمنة لدى المرضى المناسبين للعملية.","مع الدكتور أحمد الزلباني، تبدأ رحلة التكميم بتقييم طبي شامل لتحديد مدى ملاءمة العملية لحالتك، والتعرّف على النتائج المتوقعة، ووضع خطة للمتابعة بعد الجراحة."],"sections":[{"title":"ما هي عملية تكميم المعدة؟","items":[{"type":"p","text":"تكميم المعدة هو إجراء جراحي تُزال خلاله نسبة كبيرة من المعدة، لتصبح في شكل أنبوب أصغر حجمًا. ويساعد ذلك على تقليل كمية الطعام التي يمكن تناولها والشعور بالشبع بكميات أقل."},{"type":"p","text":"كما تؤثر العملية على بعض الهرمونات المرتبطة بالجوع والشهية، ومنها هرمون الجريلين، مما قد يساعد على تقليل الإحساس بالجوع لدى بعض المرضى."},{"type":"p","text":"تُجرى العملية عادةً باستخدام المنظار الجراحي، من خلال فتحات صغيرة في البطن، وفقًا لتقييم الجراح والحالة الصحية للمريض."}]},{"title":"فوائد عملية تكميم المعدة","items":[{"type":"p","text":"يمكن أن تساعد العملية، عند اختيار المريض المناسب والالتزام بتعليمات العلاج، على:"},{"type":"li","text":"فقدان قدر ملحوظ من الوزن الزائد."},{"type":"li","text":"تحسين مستويات السكر في الدم لدى بعض المرضى."},{"type":"li","text":"المساهمة في تحسين ضغط الدم ومستويات الدهون."},{"type":"li","text":"تخفيف بعض المشكلات المرتبطة بالسمنة، مثل صعوبة الحركة وآلام المفاصل."},{"type":"li","text":"تحسين القدرة على ممارسة الأنشطة اليومية وجودة الحياة."},{"type":"p","text":"تختلف النتائج من شخص إلى آخر، وتتأثر بعوامل متعددة، منها الوزن قبل العملية، والحالة الصحية، والالتزام بالنظام الغذائي والمتابعة الطبية."}]},{"title":"النتائج المتوقعة بعد التكميم","items":[{"type":"p","text":"يحدث فقدان الوزن عادةً بصورة تدريجية، ويكون ملحوظًا خلال الأشهر الأولى بعد العملية. وتستمر النتائج في التطور خلال السنة الأولى، وقد تمتد إلى ما بعدها."},{"type":"p","text":"لا تعتمد النتيجة على الجراحة وحدها، بل ترتبط أيضًا بالالتزام بالتغذية المناسبة، والنشاط البدني، والمتابعة الدورية، ومعالجة أي مشكلات صحية مصاحبة."}]},{"title":"من هو المرشح المناسب؟","items":[{"type":"p","text":"يُحدد ذلك بعد تقييم مؤشر كتلة الجسم، والأمراض المصاحبة، والتاريخ المرضي، والمحاولات السابقة لإنقاص الوزن، ومدى القدرة على الالتزام بتغييرات نمط الحياة."},{"type":"p","text":"وقد تكون العملية مناسبة لبعض مرضى السمنة الذين لم يحققوا نتائج كافية بالوسائل غير الجراحية، لكن القرار النهائي يحتاج إلى تقييم متخصص وفقًا للإرشادات الطبية المعتمدة."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يعتمد الدكتور أحمد الزلباني على التقييم الفردي لكل حالة، وشرح تفاصيل العملية وخيارات العلاج المتاحة، مع الاهتمام بالدقة الجراحية واستخدام الأدوات المناسبة، بالتعاون مع فريق طبي متخصص."},{"type":"p","text":"كما تمثل المتابعة بعد العملية جزءًا أساسيًا من خطة العلاج، وتشمل الإرشادات الغذائية، ومتابعة الوزن، وتقييم الحالة الصحية، والكشف عن أي نقص في الفيتامينات أو المعادن وعلاجه."},{"type":"p","text":"هدفنا ليس فقدان الوزن فقط، بل مساعدتك على بناء نمط حياة صحي ومستدام."}]}]},{"id":"bypass","title":"تحويل المسار","sub":"جراحات السمنة","icon":"✣","color":"teal","service":"جراحات السمنة","intro":["تحويل المسار: لعلاج السمنة وتحسين الأمراض المصاحبة","تُعد عملية تحويل المسار من جراحات السمنة المعروفة بفاعليتها في فقدان الوزن، كما قد تساعد على تحسين مرض السكري من النوع الثاني لدى بعض المرضى، وفقًا لحالتهم الصحية ومدى استجابة المرض للعلاج."],"sections":[{"title":"ما هي عملية تحويل المسار؟","items":[{"type":"p","text":"تعتمد عملية تحويل المسار على إنشاء جيب صغير من المعدة وتوصيله بجزء من الأمعاء الدقيقة، بما يؤدي إلى تقليل كمية الطعام المتناولة وإحداث تغييرات في مسار الطعام وآليات تنظيم الشهية والسكر في الدم."},{"type":"p","text":"تُجرى العملية عادةً بالمنظار الجراحي، من خلال فتحات صغيرة في البطن، بعد استكمال التقييم الطبي والتحضير اللازمين."}]},{"title":"أنواع تحويل المسار","items":[{"type":"h","text":"تحويل المسار الكلاسيكي (Roux-en-Y Gastric Bypass)"},{"type":"p","text":"يعتمد على إنشاء جيب صغير بالمعدة وتوصيله بالأمعاء الدقيقة، مع إجراء وصلة إضافية لإعادة توصيل مسار العصارات الهضمية. ويُستخدم لعلاج السمنة وبعض الحالات المصاحبة لها."},{"type":"h","text":"تحويل المسار المصغر (Mini Gastric Bypass)"},{"type":"p","text":"يعتمد على إنشاء جيب معدي طويل نسبيًا وتوصيله بالأمعاء الدقيقة من خلال وصلة واحدة. ويختلف عن التحويل الكلاسيكي في طريقة التوصيل وبعض الاعتبارات الطبية المتعلقة بالاختيار والمتابعة."},{"type":"p","text":"يحدد الجراح النوع الأنسب بعد دراسة الحالة الصحية والتاريخ المرضي والأهداف العلاجية، مع مناقشة الفوائد والمخاطر الخاصة بكل إجراء."}]},{"title":"فوائد عملية تحويل المسار","items":[{"type":"p","text":"قد تساعد العملية على:"},{"type":"li","text":"تحقيق فقدان ملحوظ في الوزن والمحافظة على النتائج على المدى الطويل."},{"type":"li","text":"تحسين السيطرة على مرض السكري من النوع الثاني لدى بعض المرضى."},{"type":"li","text":"المساهمة في تحسين ضغط الدم ومستويات الدهون."},{"type":"li","text":"تحسين الارتجاع المعدي المريئي في حالات مناسبة، وفقًا لتقييم الطبيب."},{"type":"li","text":"تحسين الحركة والقدرة على ممارسة الأنشطة اليومية."},{"type":"p","text":"وتختلف النتائج بحسب نوع العملية والحالة الصحية ومدى الالتزام بالتعليمات الطبية."}]},{"title":"كيف تتم العملية؟","items":[{"type":"p","text":"تبدأ الرحلة بإجراء الفحوصات اللازمة، ومراجعة التاريخ المرضي والأدوية، وتقييم الحالة الغذائية والتخديرية."},{"type":"p","text":"بعد ذلك، يُحدد الفريق الطبي خطة التحضير المناسبة، ثم تُجرى العملية تحت التخدير الكلي باستخدام المنظار الجراحي."},{"type":"p","text":"عقب الجراحة، تتم متابعة المريض في المستشفى، ويبدأ تناول السوائل ثم الانتقال التدريجي إلى المراحل الغذائية التالية وفقًا لتعليمات الفريق المعالج."}]},{"title":"من هو المرشح المناسب؟","items":[{"type":"p","text":"قد تكون العملية مناسبة لبعض مرضى السمنة، خاصةً في وجود أمراض مصاحبة مثل السكري من النوع الثاني، أو في بعض حالات الارتجاع المعدي الشديد، أو عند الحاجة إلى جراحة تصحيحية بعد إجراء سابق."},{"type":"p","text":"يعتمد القرار على مؤشر كتلة الجسم، والحالة الصحية، والتاريخ الجراحي، والتقييم الغذائي، وموازنة الفوائد والمخاطر لكل حالة."}]},{"title":"التعافي والمتابعة","items":[{"type":"p","text":"تتطلب العملية الالتزام بنظام غذائي تدريجي، وتناول المكملات الغذائية التي يحددها الطبيب، وإجراء التحاليل الدورية للكشف عن أي نقص في الفيتامينات والمعادن."},{"type":"p","text":"كما يُنصح بالحركة المبكرة وفقًا للتعليمات الطبية، والالتزام بمواعيد المتابعة، ومراجعة الطبيب عند ظهور أعراض غير معتادة."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يحرص الدكتور أحمد الزلباني على دراسة كل حالة بصورة مستقلة، واختيار الإجراء المناسب وفقًا للاحتياجات الطبية للمريض، مع توضيح خطوات العملية والنتائج المتوقعة والمخاطر المحتملة."},{"type":"p","text":"وتستمر الرعاية بعد الجراحة من خلال متابعة الوزن والتغذية والحالة الصحية، بما يساعد المريض على تحقيق أفضل نتيجة ممكنة والحفاظ عليها."}]}]},{"id":"sasi","title":"عملية الساسي (SASI)","sub":"جراحات السمنة","icon":"◎","color":"lilac","service":"جراحات السمنة","intro":["عملية الساسي: الجمع بين تكميم المعدة وتحويل المسار","عملية الساسي هي إحدى التقنيات الجراحية المستخدمة لعلاج السمنة، وتجمع بين تصغير المعدة وإنشاء مسار إضافي لوصول الطعام إلى جزء من الأمعاء الدقيقة.","ويهدف هذا الإجراء إلى الجمع بين تقليل كمية الطعام المتناولة وإحداث تغييرات في عملية الهضم، مع مراعاة الفوائد والمخاطر الخاصة بهذه التقنية."],"sections":[{"title":"ما هي عملية الساسي؟","items":[{"type":"p","text":"يُعرف الإجراء بالاسم الإنجليزي Single Anastomosis Sleeve Ileal Bypass، ويُشار إليه اختصارًا باسم SASI."},{"type":"p","text":"تبدأ العملية بإجراء تكميم للمعدة، ثم إنشاء وصلة بين المعدة والأمعاء الدقيقة. ويسمح هذا التصميم بمرور الطعام عبر المسار الطبيعي، مع إتاحة مسار إضافي للطعام."},{"type":"p","text":"ويختلف هذا الإجراء عن تحويل المسار الكلاسيكي في طريقة توصيل الأمعاء ومسار الطعام."}]},{"title":"كيف تتم عملية الساسي؟","items":[{"type":"p","text":"بعد استكمال الفحوصات والتقييم الطبي، تُجرى العملية تحت التخدير الكلي باستخدام المنظار الجراحي."},{"type":"p","text":"يتم أولًا تصغير المعدة، ثم إنشاء الوصلة بين المعدة والأمعاء الدقيقة وفقًا للتقنية الجراحية المعتمدة."},{"type":"p","text":"بعد العملية، يخضع المريض للملاحظة الطبية، ويبدأ النظام الغذائي التدريجي، مع تحديد برنامج متابعة يتناسب مع حالته الصحية."}]},{"title":"فوائد عملية الساسي","items":[{"type":"p","text":"قد تساعد العملية على:"},{"type":"li","text":"تقليل كمية الطعام المتناولة."},{"type":"li","text":"تحقيق فقدان ملحوظ في الوزن لدى المرضى المناسبين."},{"type":"li","text":"تحسين السيطرة على السكر لدى بعض مرضى السكري من النوع الثاني."},{"type":"li","text":"تحسين بعض المشكلات الصحية المرتبطة بالسمنة."},{"type":"p","text":"لكنها قد ترتبط بمخاطر مثل التسريب، والارتجاع، ونقص بعض العناصر الغذائية، ومضاعفات أخرى تختلف باختلاف الحالة والتقنية المستخدمة."},{"type":"p","text":"ولا يمكن افتراض أن الساسي أكثر أمانًا أو أقل تسببًا في نقص التغذية من جميع عمليات تحويل المسار؛ فذلك يعتمد على تفاصيل الإجراء وحالة المريض والمتابعة."}]},{"title":"من هو المرشح المناسب؟","items":[{"type":"p","text":"يُحدد مدى ملاءمة العملية وفقًا لمؤشر كتلة الجسم، والأمراض المصاحبة، والتاريخ المرضي والجراحي، والحالة الغذائية، والأهداف العلاجية."},{"type":"p","text":"وقد تُناقش كأحد الخيارات المتاحة لبعض مرضى السمنة، لكن اختيارها يتطلب تقييمًا متخصصًا ومناقشة البدائل الجراحية وغير الجراحية."}]},{"title":"المتابعة بعد عملية الساسي","items":[{"type":"p","text":"تُعد المتابعة المنتظمة عنصرًا أساسيًا في نجاح العلاج، وتشمل مراقبة الوزن، وتقييم الحالة الغذائية، وإجراء التحاليل اللازمة، وتحديد المكملات الغذائية المناسبة."},{"type":"p","text":"كما يُنصح بالالتزام بالتعليمات الغذائية، وتناول البروتين بالقدر الذي يوصي به الفريق المعالج، ومراجعة الطبيب عند ظهور أي أعراض غير معتادة."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يرتكز نهج الدكتور أحمد الزلباني على اختيار الإجراء المناسب لكل مريض بدلًا من اعتماد عملية واحدة لجميع الحالات."},{"type":"p","text":"ويشمل ذلك تقييم الحالة الصحية، وشرح الخيارات المتاحة، ومناقشة الفوائد والمخاطر، ووضع خطة للمتابعة بعد الجراحة، بهدف دعم التعافي وتحقيق نتائج واقعية ومستدامة."}]}]},{"id":"balloon","title":"بالون المعدة","sub":"خيار غير جراحي","icon":"○","color":"orange","service":"جراحات السمنة","intro":["بالون المعدة: خيار غير جراحي للمساعدة على إنقاص الوزن","يُعد بالون المعدة أحد الخيارات العلاجية غير الجراحية التي قد تساعد بعض الأشخاص على إنقاص الوزن، من خلال زيادة الإحساس بالشبع وتقليل كمية الطعام المتناولة.","ويُستخدم ضمن برنامج متكامل يشمل التقييم الطبي، والتغذية العلاجية، وتعديل نمط الحياة، والمتابعة المنتظمة."],"sections":[{"title":"ما هو بالون المعدة؟","items":[{"type":"p","text":"بالون المعدة جهاز طبي يُوضع داخل المعدة ليشغل جزءًا من حجمها، مما يساعد على الشعور بالامتلاء عند تناول كميات أقل من الطعام."},{"type":"p","text":"تختلف طريقة تركيب البالون ومدته داخل المعدة وفقًا لنوع الجهاز المستخدم. فبعض الأنواع تُركب وتُزال بالمنظار، بينما توجد أنواع أخرى تُبتلع في صورة كبسولة وتعمل وفق آلية مختلفة."},{"type":"p","text":"وبخلاف جراحات السمنة، لا يعتمد البالون على استئصال جزء من المعدة أو إجراء تحويل لمسار الأمعاء."}]},{"title":"كيف يساعد على إنقاص الوزن؟","items":[{"type":"p","text":"يساعد البالون على تقليل كمية الطعام التي يمكن تناولها والشعور بالشبع بصورة أسرع."},{"type":"p","text":"ومع الالتزام بالنظام الغذائي وتعديل العادات اليومية، يمكن للمريض الاستفادة من فترة وجود البالون لبناء سلوكيات صحية تساعده على المحافظة على النتائج بعد إزالته."},{"type":"p","text":"ويظل البالون أداة مساعدة، وليس حلًا مستقلًا عن الالتزام الغذائي والمتابعة الطبية."}]},{"title":"أنواع بالون المعدة","items":[{"type":"li","text":"البالون الذي يُركب بالمنظار: يُدخل إلى المعدة باستخدام المنظار، ثم يُملأ وفقًا لنوع الجهاز. وتتم إزالته بالطريقة المحددة من الشركة المصنعة، في الموعد المقرر."},{"type":"li","text":"البالون القابل للبلع: يتوافر في بعض الأنظمة الطبية على هيئة كبسولة تُبتلع، ويعمل لفترة محددة بحسب نوع الجهاز وتعليماته. وتختلف آلية خروجه من الجسم ومدته عن البالونات التقليدية."},{"type":"p","text":"يحدد الطبيب مدى ملاءمة كل نوع بناءً على الحالة الصحية، ومؤشر كتلة الجسم، وتفضيلات المريض، والموانع الطبية المحتملة."}]},{"title":"من هو المرشح المناسب؟","items":[{"type":"p","text":"قد يناسب البالون بعض الأشخاص الذين يعانون من زيادة الوزن أو السمنة، ويرغبون في دعم جهودهم لإنقاص الوزن دون الخضوع لجراحة السمنة التقليدية."},{"type":"p","text":"ويعتمد الاختيار على مؤشر كتلة الجسم، والحالة الصحية، والتاريخ المرضي، ووجود مشكلات بالمعدة أو المريء، ومدى القدرة على الالتزام بالبرنامج العلاجي."},{"type":"p","text":"ولا يناسب البالون جميع المرضى، كما قد لا يكون كافيًا وحده في حالات السمنة الشديدة التي تتطلب خيارات علاجية أخرى."}]},{"title":"فوائد بالون المعدة","items":[{"type":"li","text":"إجراء لا يتطلب عادةً جراحة تقليدية."},{"type":"li","text":"المساعدة على الشعور بالشبع وتناول كميات أقل."},{"type":"li","text":"إمكانية دمجه مع برنامج غذائي وسلوكي متكامل."},{"type":"li","text":"عدم إحداث تغيير جراحي دائم في تشريح المعدة والأمعاء."},{"type":"p","text":"ومع ذلك، قد يسبب البالون الغثيان والقيء وآلام البطن، وقد تحدث مضاعفات أكثر خطورة في بعض الحالات. لذلك، يلزم التقييم الطبي والمتابعة وفقًا لتعليمات الجهاز المستخدم."}]},{"title":"التعافي بعد تركيب البالون","items":[{"type":"p","text":"قد يشعر المريض بالغثيان أو الانزعاج أو التقلصات خلال الأيام الأولى، وتختلف شدة هذه الأعراض ومدتها من شخص إلى آخر."},{"type":"p","text":"يُحدد الطبيب الأدوية المناسبة، وخطة التغذية التي تبدأ عادةً بالسوائل ثم تتدرج إلى الأطعمة الأخرى، بحسب نوع البالون والحالة الصحية."},{"type":"p","text":"ويجب التواصل مع الفريق الطبي عند حدوث ألم شديد أو قيء مستمر أو أعراض غير معتادة."}]},{"title":"النتائج المتوقعة","items":[{"type":"p","text":"تختلف كمية الوزن المفقود باختلاف نوع البالون، ومدة استخدامه، والوزن الأولي، والالتزام بالبرنامج الغذائي والمتابعة."},{"type":"p","text":"وقد يساعد فقدان الوزن على تحسين بعض المشكلات الصحية المرتبطة بالسمنة، لكن لا يمكن ضمان نتيجة محددة لكل مريض."},{"type":"p","text":"وتتمثل إحدى أهم خطوات النجاح في الاستفادة من فترة العلاج لبناء عادات صحية تساعد على تقليل احتمال استعادة الوزن بعد إزالة البالون."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يبدأ البرنامج بتقييم طبي لتحديد مدى ملاءمة البالون، ثم اختيار النوع المناسب بالتعاون مع الفريق المعالج."},{"type":"p","text":"وتشمل الرعاية شرح الإجراء، وتوضيح النتائج الواقعية والمخاطر المحتملة، ومتابعة الوزن والتغذية خلال فترة العلاج، مع وضع خطة تساعد المريض على المحافظة على النتائج."}]}]},{"id":"sweat","title":"علاج فرط التعرق","sub":"بالمنظار","icon":"⌁","color":"sky","service":"جراحة المناظير","intro":["علاج فرط التعرق: راحة أكبر وثقة في الحياة اليومية","قد يتجاوز التعرق الزائد كونه مشكلة مزعجة، ليؤثر في الأنشطة اليومية والتعاملات الاجتماعية والثقة بالنفس، خصوصًا عندما يصيب اليدين أو مناطق أخرى بصورة مستمرة.","وتوجد خيارات متعددة لعلاج فرط التعرق، ويعتمد اختيار العلاج على المنطقة المصابة، وشدة الأعراض، والأسباب المحتملة، ومدى الاستجابة للعلاجات السابقة."],"sections":[{"title":"ما هي عملية علاج فرط التعرق؟","items":[{"type":"p","text":"قطع العصب الودي الصدري بالمنظار (Endoscopic Thoracic Sympathectomy – ETS) هو إجراء جراحي يُستخدم في حالات مختارة من فرط التعرق، وخاصةً تعرق اليدين الشديد الذي لم يستجب للعلاجات الأخرى."},{"type":"p","text":"يتم الإجراء من خلال فتحات صغيرة في منطقة الصدر، ويستخدم الجراح المنظار للوصول إلى المسارات العصبية المستهدفة، ثم يتعامل معها وفقًا للخطة الجراحية المحددة."},{"type":"p","text":"ويُجرى الإجراء تحت التخدير الكلي، وتختلف مدته وفترة الإقامة بالمستشفى بحسب الحالة وطبيعة التدخل."}]},{"title":"متى يُنصح بالتدخل الجراحي؟","items":[{"type":"p","text":"لا تُعد الجراحة الخيار الأول لكل حالات التعرق الزائد. ويبدأ التقييم بتحديد ما إذا كان فرط التعرق أوليًا أم ناتجًا عن مشكلة صحية أخرى أو عن استخدام بعض الأدوية."},{"type":"p","text":"وقد تُناقش الجراحة في حالات مختارة، خاصةً عندما يكون التعرق شديدًا ومؤثرًا في الحياة اليومية، وبعد عدم تحقيق نتائج كافية بالعلاجات غير الجراحية المناسبة."}]},{"title":"فوائد العملية","items":[{"type":"p","text":"قد تساعد العملية على تقليل التعرق في المنطقة المستهدفة بدرجة ملحوظة، خصوصًا لدى بعض المرضى الذين يعانون من تعرق اليدين الشديد."},{"type":"p","text":"وقد ينعكس ذلك إيجابيًا على الأنشطة اليومية، مثل المصافحة والكتابة واستخدام الأجهزة، وعلى الراحة النفسية والاجتماعية."},{"type":"p","text":"وتختلف درجة التحسن من شخص إلى آخر، ولا يمكن ضمان توقف التعرق نهائيًا في جميع الحالات."}]},{"title":"المخاطر التي يجب معرفتها","items":[{"type":"p","text":"من أهم الأمور التي يجب مناقشتها قبل العملية احتمال حدوث التعرق التعويضي، وهو زيادة التعرق في مناطق أخرى من الجسم، مثل الظهر أو البطن أو الصدر."},{"type":"p","text":"وقد يكون التعرق التعويضي بسيطًا لدى بعض المرضى، لكنه قد يكون شديدًا ومزعجًا لدى آخرين. وقد تشمل المخاطر أيضًا مضاعفات مرتبطة بالتخدير أو الجراحة الصدرية."},{"type":"p","text":"لذلك، فإن اتخاذ القرار يحتاج إلى مناقشة دقيقة للفوائد المتوقعة والمخاطر والبدائل المتاحة."}]},{"title":"التعافي بعد العملية","items":[{"type":"p","text":"تعتمد فترة التعافي على طبيعة الإجراء والحالة الصحية للمريض. وقد يشعر المريض بألم في منطقة الصدر أو الكتف بعد الجراحة."},{"type":"p","text":"يحدد الطبيب توقيت العودة إلى العمل والأنشطة اليومية والرياضية، مع ضرورة الالتزام بتعليمات الرعاية المنزلية والمتابعة الطبية."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يحرص الدكتور أحمد الزلباني على تقييم حالات فرط التعرق بعناية، وتحديد مدى ملاءمة التدخل الجراحي، وشرح البدائل والمخاطر، بما في ذلك احتمالية التعرق التعويضي."},{"type":"p","text":"والهدف هو مساعدة المريض على اتخاذ قرار علاجي واعٍ يستند إلى فهم واضح للنتائج المحتملة وطبيعة التعافي."}]}]},{"id":"scope","title":"جراحة المناظير","sub":"دقة وتدخل محدود","icon":"✚","color":"pink","service":"جراحة المناظير","intro":["جراحة المناظير: دقة جراحية وتدخل محدود","أصبحت جراحة المناظير من التقنيات المهمة في العديد من التخصصات الجراحية، إذ تتيح إجراء عمليات محددة من خلال فتحات صغيرة بدلًا من الشقوق الجراحية الكبيرة المستخدمة في كثير من الجراحات المفتوحة.","ويعتمد اختيار هذه التقنية على نوع العملية، والحالة الصحية للمريض، ومدى ملاءمة المنظار لتحقيق أفضل نتيجة ممكنة."],"sections":[{"title":"ما هي جراحة المناظير؟","items":[{"type":"p","text":"جراحة المناظير هي تقنية جراحية يستخدم فيها الطبيب كاميرا دقيقة وأدوات مخصصة للوصول إلى المنطقة المستهدفة من خلال فتحات صغيرة في الجسم."},{"type":"p","text":"تُنقل صورة المنطقة الجراحية إلى شاشة، مما يتيح للجراح رؤية التفاصيل ومتابعة خطوات الإجراء بدقة."},{"type":"p","text":"وتُستخدم هذه التقنية في العديد من عمليات البطن والصدر وجراحات السمنة، إلى جانب بعض جراحات الأطفال والإجراءات المتخصصة."}]},{"title":"الفرق بين المناظير والجراحة المفتوحة","items":[{"type":"p","text":"تعتمد الجراحة المفتوحة على إجراء شق جراحي يسمح بالوصول المباشر إلى المنطقة المراد علاجها، بينما تعتمد جراحة المناظير على فتحات أصغر وأدوات وكاميرا مخصصة."},{"type":"p","text":"وفي العمليات المناسبة، قد توفر جراحة المناظير مزايا مثل:"},{"type":"li","text":"تقليل حجم الشقوق الجراحية."},{"type":"li","text":"تقليل الألم بعد العملية في كثير من الحالات."},{"type":"li","text":"تقليل حجم الندبات."},{"type":"li","text":"تقصير فترة التعافي والإقامة بالمستشفى في عدد من الإجراءات."},{"type":"li","text":"تسهيل العودة التدريجية إلى الأنشطة اليومية."},{"type":"p","text":"لكن هذه المزايا تختلف بحسب نوع العملية والحالة الصحية، ولا تعني أن المنظار يخلو من المخاطر أو أنه الخيار الأنسب لكل مريض."}]},{"title":"ما العمليات التي يمكن إجراؤها بالمنظار؟","items":[{"type":"p","text":"تُستخدم جراحة المناظير في مجموعة واسعة من الإجراءات، ومنها:"},{"type":"li","text":"جراحات السمنة: مثل تكميم المعدة وتحويل المسار وبعض تقنيات جراحات السمنة الأخرى."},{"type":"li","text":"جراحات البطن: مثل استئصال المرارة والزائدة الدودية وإصلاح بعض أنواع الفتق."},{"type":"li","text":"جراحات الأطفال: في بعض الحالات التي يمكن علاجها باستخدام أدوات وتقنيات مناسبة للأطفال."},{"type":"li","text":"جراحات الصدر المتخصصة: مثل بعض حالات قطع العصب الودي الصدري بالمنظار لعلاج فرط التعرق."},{"type":"p","text":"ويحدد الجراح مدى ملاءمة المنظار وفقًا للتشخيص والتفاصيل الطبية لكل حالة."}]},{"title":"التحضير للجراحة","items":[{"type":"p","text":"يبدأ التحضير بتقييم طبي يشمل مراجعة التاريخ المرضي والأدوية، وإجراء الفحوصات اللازمة، وتقييم الحالة العامة ومدى الاستعداد للتخدير."},{"type":"p","text":"كما يوضح الفريق الطبي للمريض طبيعة الإجراء، وتعليمات الصيام، والأدوية التي قد تحتاج إلى تعديل تحت إشراف الطبيب، وخطة التعافي المتوقعة."}]},{"title":"التعافي بعد جراحة المناظير","items":[{"type":"p","text":"قد يشعر المريض بألم في مواضع الفتحات الجراحية أو بانزعاج مؤقت بعد العملية. وتختلف مدة التعافي بحسب نوع التدخل وحالة المريض."},{"type":"p","text":"يساعد الالتزام بتعليمات الطبيب والحركة المبكرة عندما تكون مناسبة على دعم التعافي وتقليل بعض المضاعفات."},{"type":"p","text":"وتشمل المتابعة تقييم الجروح والأعراض، وتحديد موعد العودة للعمل والأنشطة المعتادة، وفقًا لطبيعة العملية."}]},{"title":"لماذا تختار الدكتور أحمد الزلباني؟","items":[{"type":"p","text":"يركز الدكتور أحمد الزلباني على التقييم الدقيق، واختيار التقنية الجراحية المناسبة، وشرح تفاصيل الإجراء للمريض قبل اتخاذ القرار."},{"type":"p","text":"وتتمثل الأولوية في تقديم رعاية جراحية منظمة تشمل التحضير للعملية، والتنسيق مع الفريق الطبي، والمتابعة بعد الجراحة، بما يتناسب مع احتياجات كل حالة."}]}]}]};
